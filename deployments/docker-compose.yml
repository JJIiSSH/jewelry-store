services: 
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: IvanDev
      POSTGRES_PASSWORD: 1111
      POSTGRES_DB: mydb
    ports:
      - "5432:5432"
  redis:
    image: redis:7
    ports:
      - "6379:6379"
  minio:
    image: minio/minio
    environment:
      MINIO_ROOT_USER: ivanadmin
      MINIO_ROOT_PASSWORD: 50202349903L
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
